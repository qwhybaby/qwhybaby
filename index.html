<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bio Link</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #0b0b0b;
            color: #ffffff;
            overflow: hidden;
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            isolation: isolate;
        }

        /* =========================
           BACKGROUND VIDEO
        ========================= */

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;
            object-position: center center;

            display: block;
            z-index: -2;

            filter: brightness(45%);
        }

        /* Dark layer over video */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.05);
            z-index: -1;
            pointer-events: none;
        }

        /* =========================
           ENTRY OVERLAY
        ========================= */

        #overlay {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: #050505;

            z-index: 9999;

            display: flex;
            justify-content: center;
            align-items: center;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;

            cursor: pointer;
        }

        #enter-btn {
            background: none;
            border: 2px solid #ffffff;

            color: #ffffff;

            padding: 15px 40px;

            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;

            cursor: pointer;

            border-radius: 50px;

            transition: all 0.3s ease;

            animation: pulse 2s infinite;
        }

        #enter-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4);
            }

            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 15px rgba(255, 255, 255, 0);
            }

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }

        /* =========================
           PROFILE CONTAINER
        ========================= */

        .container {
            position: relative;
            z-index: 1;

            width: calc(100% - 40px);
            max-width: 420px;

            padding: 30px 20px;

            text-align: center;

            background: rgba(0, 0, 0, 0.4);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            border-radius: 24px;

            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* =========================
           PROFILE
        ========================= */

        .profile-img {
            width: 100px;
            height: 100px;

            border-radius: 50%;

            border: 2px solid #ffffff;

            margin-bottom: 15px;

            object-fit: cover;
        }

        .username {
            font-size: 1.3rem;
            font-weight: bold;

            margin-bottom: 6px;

            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 0.9rem;

            color: #8a8a8a;

            margin-bottom: 35px;
        }

        /* =========================
           LINKS
        ========================= */

        .links-wrapper {
            display: flex;
            flex-direction: column;

            gap: 16px;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.08);

            color: #ffffff;

            padding: 16px;

            border-radius: 12px;

            text-decoration: none;

            font-weight: 600;

            font-size: 0.95rem;

            transition: all 0.2s ease-in-out;

            display: block;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.12);

            transform: translateY(-2px);

            border-color: rgba(255, 255, 255, 0.25);
        }

        /* =========================
           HIDDEN AUDIO
        ========================= */

        #music-player {
            display: none;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {
            .container {
                width: calc(100% - 30px);
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         ENTRY SCREEN
    ========================= -->

    <div id="overlay" onclick="startPage()">
        <button id="enter-btn">Enter</button>
    </div>


    <!-- =========================
         BACKGROUND VIDEO
    ========================= -->

    <video
        id="bg-video"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
    >
        <source src="fly.mp4" type="video/mp4">
    </video>


    <!-- =========================
         MAIN PROFILE
    ========================= -->

    <div class="container">

        <div class="username">
            @QwhyBaby
        </div>

        <div class="bio">
            superstar
        </div>

        <div class="links-wrapper">

            <a
                href="https://soundcloud.com/qwhybaby"
                target="_blank"
                rel="noopener noreferrer"
                class="link-card"
            >
                SoundCloud
            </a>

            <a
                href="https://instagram.com/qwhybaby"
                target="_blank"
                rel="noopener noreferrer"
                class="link-card"
            >
                Instagram
            </a>

        </div>

    </div>


    <!-- =========================
         MUSIC
    ========================= -->

    <audio id="music-player" loop>
        <source src="fly.mp3" type="audio/mpeg">
    </audio>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>
        function startPage() {

            const overlay = document.getElementById("overlay");
            const audio = document.getElementById("music-player");
            const video = document.getElementById("bg-video");

            // Start video
            video.play().catch(function(error) {
                console.log("Video playback error:", error);
            });

            // Start music after user interaction
            audio.play().catch(function(error) {
                console.log("Audio playback error:", error);
            });

            // Fade out entry screen
            overlay.style.opacity = "0";

            setTimeout(function() {
                overlay.style.visibility = "hidden";
                overlay.style.pointerEvents = "none";
            }, 500);
        }
    </script>

</body>
</html>
